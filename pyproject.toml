[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ase-auto-build"
version = "0.9.2"
description = "ASE_auto_build: a fine-tuned local LLM that turns plain-language descriptions into validated ASE-built structures"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# Core = the deterministic builders and the tool registry. The model itself is
# heavy (CUDA torch + transformers + peft), so it lives in the `agent` extra.
dependencies = [
    "PyYAML",
    "ase",
]

[project.optional-dependencies]
# The fine-tuned local structure agent. torch must match the machine's CUDA
# build, so it is not pinned here; install it first.
agent = ["torch", "transformers", "peft", "bitsandbytes", "accelerate"]
# Fine-tuning and evaluation: see training/requirements-train.txt for the
# pinned remote-pilot versions.
train = ["torch", "transformers", "peft", "bitsandbytes", "accelerate", "datasets", "trl"]
# Development: run the test suite.
dev = ["pytest"]

[project.scripts]
# Natural-language front door: a plain-language description in, a ready-to-run
# case directory out. Needs the fine-tuned local model — see the `agent`
# extra — but its argument handling imports without it.
ASE_auto_build = "vasp_auto.ase_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vasp_auto*"]
